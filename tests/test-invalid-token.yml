name: Test invalid bot token error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Attempt to send with invalid token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          bot_token: xoxb-invalid-token-for-testing
          channel_id: C0000000000
          payload: |
            {
              "text": "This should fail due to invalid token"
            }

      - name: Assert action failed with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"
