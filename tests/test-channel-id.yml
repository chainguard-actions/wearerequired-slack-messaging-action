name: Test Slack message send with channel_id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Slack messaging action with channel_id
        id: action
        uses: .
        continue-on-error: true
        with:
          bot_token: xoxb-fake-token-for-testing
          channel_id: C0123456789
          payload: |
            {
              "text": "Hello from GitHub Actions test using channel_id!"
            }
      - name: Assert action ran (outcome is either success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
