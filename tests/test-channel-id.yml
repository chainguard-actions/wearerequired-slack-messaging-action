name: Test channel_id input error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with channel_id instead of channel name (expect failure due to invalid token)
        id: action
        uses: .
        continue-on-error: true
        with:
          bot_token: 'xoxb-invalid-token-for-testing'
          channel_id: 'C0123456789'
          payload: |
            {
              "text": "Hello from GitHub Actions test via channel_id",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test message* from GitHub Actions"
                  }
                }
              ]
            }

      - name: Assert action failed with invalid token (channel_id path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token using channel_id, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token when using channel_id"
