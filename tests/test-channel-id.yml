name: Test channel_id input variant
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          bot_token: "xoxb-fake-token-for-testing"
          channel_id: "C0123456789"
          payload: |
            {
              "text": "Test message with channel_id",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test*: channel_id input variant"
                  }
                }
              ]
            }

      - name: Assert action ran with channel_id input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MESSAGE_ID: ${{ steps.action.outputs.message_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "message_id: $MESSAGE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MESSAGE_ID" ]; then
              echo "FAIL: action succeeded but message_id output is empty"
              exit 1
            fi
            echo "PASS: message sent with channel_id, message_id=$MESSAGE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake token - Slack API rejected auth)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
