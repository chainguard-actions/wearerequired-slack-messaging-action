name: Test update existing message with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          bot_token: 'xoxb-invalid-token-for-testing'
          channel: 'test-channel'
          channel_id: 'C0123456789'
          payload: '{"text": "Updated message from GitHub Actions test"}'
          message_id: '1234567890.123456'
      - name: Assert action failed with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token when updating message, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token when updating existing message"
