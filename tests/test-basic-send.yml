name: Test basic send message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Slack messaging action with invalid token
        id: action
        uses: .
        continue-on-error: true
        with:
          bot_token: xoxb-invalid-token-for-testing
          channel: test-channel
          payload: '{"text": "Hello from GitHub Actions test"}'
      - name: Assert action ran (outcome is failure due to invalid token, not missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid Slack token, not because of missing inputs
          # This confirms the action accepted all required inputs and attempted the API call
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
