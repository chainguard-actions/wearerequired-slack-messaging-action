name: Test update existing Slack message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check if Slack credentials are available
        id: check-creds
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "WARN: Slack credentials not available, skipping live API test"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send initial Slack message
        id: initial
        if: steps.check-creds.outputs.skip != 'true'
        uses: .
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload: |
            {
              "text": "Initial message - will be updated"
            }

      - name: Assert initial message_id is set
        if: steps.check-creds.outputs.skip != 'true'
        env:
          ACTUAL: ${{ steps.initial.outputs.message_id }}
        run: |
          echo "initial message_id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected initial message_id to be non-empty"
            exit 1
          fi
          echo "PASS: initial message_id is $ACTUAL"

      - name: Update the Slack message
        id: updated
        if: steps.check-creds.outputs.skip != 'true'
        uses: .
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          message_id: ${{ steps.initial.outputs.message_id }}
          payload: |
            {
              "text": "Updated message content"
            }

      - name: Assert updated message_id matches initial
        if: steps.check-creds.outputs.skip != 'true'
        env:
          INITIAL_ID: ${{ steps.initial.outputs.message_id }}
          UPDATED_ID: ${{ steps.updated.outputs.message_id }}
        run: |
          echo "initial message_id: $INITIAL_ID"
          echo "updated message_id: $UPDATED_ID"
          if [ -z "$UPDATED_ID" ]; then
            echo "FAIL: expected updated message_id to be non-empty"
            exit 1
          fi
          if [ "$INITIAL_ID" != "$UPDATED_ID" ]; then
            echo "FAIL: expected updated message_id ($UPDATED_ID) to match initial ($INITIAL_ID)"
            exit 1
          fi
          echo "PASS: message updated successfully, message_id=$UPDATED_ID"

      - name: Skip notice
        if: steps.check-creds.outputs.skip == 'true'
        run: |
          echo "SKIP: Slack credentials not configured, skipping live API test"
          echo "PASS: test skipped gracefully"
